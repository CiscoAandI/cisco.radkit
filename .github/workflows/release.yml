name: Release

on:
  push:
    tags:
      - 'v*'  # Triggers on version tags like v1.0.0, v2.1.3, etc.

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Required for creating releases and updating files
      
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Fetch full history for changelog generation
        
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install ansible-core
        pip install git-changelog
        pip install toml  # For parsing/updating pyproject.toml
        
    - name: Extract version from tag
      id: version
      run: |
        TAG="${GITHUB_REF#refs/tags/}"
        VERSION="${TAG#v}"
        if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.]+)?$'; then
          echo "Invalid version derived from tag: $TAG"; exit 1
        fi
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"
        echo "tag=$TAG" >> "$GITHUB_OUTPUT"
        
    - name: Update version files
      env:
        VERSION: ${{ steps.version.outputs.version }}
      run: |
        # Update galaxy.yml version (VERSION is validated semver, anchor pattern to start of line)
        sed -i "s/^version: .*/version: ${VERSION}/" galaxy.yml

        # Update pyproject.toml version using Python (read VERSION from env, not interpolated)
        python - << 'PY'
        import os, toml
        v = os.environ['VERSION']
        with open('pyproject.toml', 'r') as f:
            data = toml.load(f)
        cur = data.get('tool', {}).get('poetry', {}).get('version', '')
        if cur != v:
            data['tool']['poetry']['version'] = v
            with open('pyproject.toml', 'w') as f:
                toml.dump(data, f)
            print(f"Updated pyproject.toml {cur} -> {v}")
        else:
            print(f"pyproject.toml already {cur}")
        PY
        
    - name: Check for version changes
      id: check_changes
      run: |
        if git diff --quiet galaxy.yml pyproject.toml; then
          echo "changes=false" >> $GITHUB_OUTPUT
          echo "No version changes needed"
        else
          echo "changes=true" >> $GITHUB_OUTPUT
          echo "Version files updated"
          git diff galaxy.yml pyproject.toml
        fi
        
    - name: Generate changelog
      id: changelog
      env:
        TAG: ${{ steps.version.outputs.tag }}
      run: |
        # Generate changelog for this release (TAG from env, quoted)
        git-changelog --template keepachangelog --output RELEASE_CHANGELOG.md \
          --sections "feat,fix,refactor,perf" --starting-tag "$TAG"

        # Update main CHANGELOG.md
        if [ ! -f CHANGELOG.md ]; then
          echo "# Changelog" > CHANGELOG.md
          echo "" >> CHANGELOG.md
        fi

        # Insert new changelog entry at the top
        temp_file=$(mktemp)
        head -n 2 CHANGELOG.md > "$temp_file"
        echo "" >> "$temp_file"
        cat RELEASE_CHANGELOG.md >> "$temp_file"
        echo "" >> "$temp_file"
        tail -n +3 CHANGELOG.md >> "$temp_file"
        mv "$temp_file" CHANGELOG.md

        # Set changelog content for release notes using a random delimiter (prevents injection)
        DELIM="ghout_$(openssl rand -hex 16)"
        {
          echo "changelog<<$DELIM"
          cat RELEASE_CHANGELOG.md
          echo "$DELIM"
        } >> "$GITHUB_OUTPUT"
        
    - name: Commit updated files
      if: steps.check_changes.outputs.changes == 'true'
      env:
        VERSION: ${{ steps.version.outputs.version }}
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add galaxy.yml pyproject.toml CHANGELOG.md
        git commit -m "chore: update version to ${VERSION} and changelog"
        git push origin HEAD:main

    - name: Commit changelog only
      if: steps.check_changes.outputs.changes == 'false'
      env:
        VERSION: ${{ steps.version.outputs.version }}
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add CHANGELOG.md
        git commit -m "chore: update changelog for ${VERSION}" || exit 0
        git push origin HEAD:main
        
    - name: Build Ansible collection
      run: |
        ansible-galaxy collection build
        
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.version.outputs.tag }}
        name: Release ${{ steps.version.outputs.tag }}
        body: |
          ## What's Changed

          ${{ steps.changelog.outputs.changelog }}

          ## Installation

          ```bash
          ansible-galaxy collection install cisco.radkit:${{ steps.version.outputs.version }}
          ```

          Or download the collection artifact below and install locally:

          ```bash
          ansible-galaxy collection install cisco-radkit-${{ steps.version.outputs.version }}.tar.gz
          ```

        files: ./*.tar.gz
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Publish to Ansible Galaxy
      env:
        ANSIBLE_GALAXY_TOKEN: ${{ secrets.ANSIBLE_GALAXY_TOKEN }}
      run: |
        artifact=$(ls -1 ./*.tar.gz | head -n1)
        ansible-galaxy collection publish "$artifact" --token "$ANSIBLE_GALAXY_TOKEN"
