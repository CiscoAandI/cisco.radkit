[tool.poetry]
name = "ansible-cisco-radkit"
version = "2.1.1"
description = "Ansible Galaxy Collection for Cisco RADKit"
authors = ["Scott Dozier <scdozier@cisco.com>"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = ">= 3.10, < 3.14"
ansible = "^9.2.0"
pproxy = "^2.7.0"
httpx = "^0.27.2"
cisco-radkit-client = "==1.9.9"
cisco-radkit-genie = "==1.9.9"

[[tool.poetry.source]]
name = "radkit"
url = "https://radkit.cisco.com/pip"
priority = "supplemental"

[tool.poetry.group.dev.dependencies]
ansible-lint = "^6.0.0"
black = "^26.3.1"
isort = "^5.12.0"
yamllint = "^1.32.0"

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88

[tool.black]
line-length = 88
target-version = ['py39']
include = '\.pyi?$'
extend-exclude = '''
/(
  \.eggs
  | \.git
  | \.pytest_cache
  | \.venv
  | build
  | dist
  | tmp
)/
'''

