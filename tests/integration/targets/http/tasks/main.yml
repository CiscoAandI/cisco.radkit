# Test HTTP module - verify module executes and returns response
# Note: sandboxdnac device may return 500 if device auth not configured
- name:  Execute HTTP GET on sandboxdnac
  cisco.radkit.http:
    device_name: '{{ http_device_name_1 }}'
    client_key_password_b64: "{{ radkit_client_private_key_password_base64 }}"
    identity: "{{ radkit_identity }}"
    service_serial: "{{ radkit_service_serial }}"
    path: /dna/home
    method: get
    status_code: [200, 500]  # Accept 500 for device auth issues
  register: http_output
  delegate_to: localhost

- assert:
    that:
      - http_output.status_code in [200, 500]
      - http_output.data is defined